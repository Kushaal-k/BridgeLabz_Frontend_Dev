<!DOCTYPE html>
<html>
<head>
  <title>Promotional Banners</title>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>

  <style>
    .banner {
      width: 300px;
      padding: 15px;
      margin: 10px;
      background: #ffefd5;
      border: 1px solid #e0b46a;
      font-size: 18px;
      text-align: center;
    }

    #controls button {
      margin: 5px;
      padding: 8px 12px;
    }
  </style>
</head>

<body>

  <div class="banner" id="banner1">Super Sale! 50% Off!</div>
  <div class="banner" id="banner2">Free Delivery on Orders Over $50!</div>
  <div class="banner" id="banner3">Buy 1 Get 1 Free Today Only!</div>

  <div id="controls">
    <button id="hideBtn">Hide</button>
    <button id="showBtn">Show</button>
    <button id="slideBtn">Slide Up/Down</button>
    <button id="fadeBtn">Fade In/Out</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
